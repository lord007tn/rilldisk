[package]
name = "rilldisk-core"
description = "Disk metadata scanning, query and confirmed-cleanup engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
rayon = "1.11"
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
flate2 = "1.1"
