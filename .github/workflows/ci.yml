name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MCP acceptance (real stdio)
        if: runner.os == 'Windows'
        run: python scripts/test_mcp.py target/release/rilldisk.exe
      - name: MCP acceptance (real stdio)
        if: runner.os != 'Windows'
        run: python scripts/test_mcp.py target/release/rilldisk
      - if: runner.os != 'Windows'
        run: python scripts/test_cli_signals.py target/release/rilldisk
      - name: Drive listing smoke test
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          target/release/rilldisk$ext drives
          target/release/rilldisk$ext drives --format json | python -c "import json,sys; d=json.load(sys.stdin); assert d and all(v['total_bytes'] > 0 for v in d), d"
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rilldisk-windows-x86_64
          path: |
            target/release/rilldisk.exe
            target/release/rilldisk-desktop.exe
