[package]
name = "rilldisk-desktop"
description = "Native GPU desktop for RillDisk: treemap, tree and reclaim views"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rilldisk-desktop"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
rilldisk-core = { path = "../rilldisk-core", version = "0.1.0" }
rilldisk-update = { path = "../rilldisk-update", version = "0.1.0" }
eframe = "0.37"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Shell"] }
