[workspace]
members = ["crates/rilldisk-core", "crates/rilldisk-update", "crates/rilldisk-mcp-setup", "crates/rilldisk", "crates/rilldisk-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/lord007tn/rilldisk"
authors = ["Raed Bahri"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
